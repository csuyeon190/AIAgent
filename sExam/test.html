  function afterPrint(){
    window.location.reload();

  /* 용어집 */
  const container = document.querySelector('.txt_wrap')
  function getGlossaryData() {
    try{
      // 아티클 키워드 필드 데이터 뽑기
      // 배열에 주소 추가
      // 상세 텍스트 비교

      let data = []

      [[--ActionStart,row:*,kr6_12,sort:#DEFAULT#--]][[--IfStart,exist:keyword_obj--]][[--ThenStart--]]
        data.push( {
        keyword: `[[--ArtFieldValue,field:keyword_obj--]]`.split(','),
        url : `[[--ArtAddress--]]`
        })
        [[--ThenEnd--]][[--IfEnd--]][[--ActionEnd--]]


      console.log(data)

      keywordList = []
      data.forEach(item => {
        item.keyword.forEach(word => {
          let trimWord = word.trim()
          keywordList.push({
            trimWord,
            url: item.url
          })
        })
      })

      keywordList.sort((a,b) => {
        b.trimWord.length - a.trimWord.length
      })

      const walker = document.createTreeWalker(
        container,
        NodeFilter.SHOW_TEXT
      )
      console.log(keywordList)
      const textNodes = []
      let node
      while ((node = walker.nextNode())) {
        console.log(node.textContent, node.parentElement)
        textNodes.push(node)
      }
      console.log(textNodes)
      textNodes.forEach(textNode =>{

        let html = textNode.textContent
        keywordList.forEach(item => {
          html = html.replaceAll(
            item.trimWord,
            `<a href="${item.url}" style="color:blue">${item.trimWord}</a>`
          )


          if (html !== textNode.textContent){
            const parent = textNode.parentNode
            if (!parent) return

            const template = document.createElement('template')
            template.innerHTML = html
            textNode.replaceWith(template.content)
          }
        })

      })
    } catch(err){
      console.error(err)
    }
  }

  getGlossaryData()

</script>

        <!-- 페이지 스크립트 -->
        <script>
            $(function () {
                let navFlag = false;

                // nav
                $(".insight-report-detail__side-link").on("click", function (e) {
                    e.preventDefault();

                    const targetId = $(this).attr("href");
                    const $target = $(targetId);

                    if (!$target.length) return;

                    if (navFlag) return;
                    navFlag = true;

                    const lenis = ScrollUtil.getLenis();
                    const offset = 80;

                    $(".insight-report-detail__side-item").removeClass("is-active");
                    $(".insight-report-detail__side-link").removeAttr("aria-current");

                    $(this).attr("aria-current", "location").closest(".insight-report-detail__side-item").addClass("is-active");

                    if (lenis && typeof lenis.scrollTo === "function") {
                        lenis.scrollTo($target[0], {
                            offset: -offset,
                            duration: 0.4,
                        });
                    } else {
                        $("html, body")
                            .stop()
                            .animate(
                                {
                                    scrollTop: $target.offset().top - offset,
                                },
                                400,
                            );
                    }

                    setTimeout(() => {
                        navFlag = false;
                    }, 430);
                });

                // nav active
                function updateInsightSideNav() {
                    if (navFlag) return;

                    const scrollTop = ScrollUtil.getScrollTop();
                    const triggerPoint = scrollTop + $(window).height() * 0.8;
                    let activeId = "";

                    $(".insight-report-detail__side-link").each(function () {
                        const targetId = $(this).attr("href");
                        const $target = $(targetId);

                        if (!$target.length) return;

                        if ($target.offset().top <= triggerPoint) {
                            activeId = targetId;
                        }
                    });

                    if (!activeId) return;

                    $(".insight-report-detail__side-item").removeClass("is-active");
                    $(".insight-report-detail__side-link").removeAttr("aria-current");

                    $(`.insight-report-detail__side-link[href="${activeId}"]`).attr("aria-current", "location").closest(".insight-report-detail__side-item").addClass("is-active");
                }

                $(window).on("scroll.insightSideNav", updateInsightSideNav);

                updateInsightSideNav();

                // s:260728
                const relatedSwiperSelector = ".insight-report-detail__related-swiper";
                const eventSwiperSelector = ".insight-report-detail__event-swiper";

                const relatedSwiperEl = document.querySelector(relatedSwiperSelector);
                const eventSwiperEl = document.querySelector(eventSwiperSelector);

                const relatedSlideCount = relatedSwiperEl ? relatedSwiperEl.querySelectorAll(".swiper-wrapper > .swiper-slide:not(.swiper-slide-duplicate)").length : 0;

                const eventSlideCount = eventSwiperEl ? eventSwiperEl.querySelectorAll(".swiper-wrapper > .swiper-slide:not(.swiper-slide-duplicate)").length : 0;

                const eventCanLoop = eventSlideCount > 1;

                const SWIPER_FOCUSABLE_SELECTOR = ["a[href]", "button:not([disabled])", "input:not([disabled])", "select:not([disabled])", "textarea:not([disabled])", "[tabindex]"].join(", ");

                /**
                 * 현재 related Swiper 구간 반환
                 */
                function getRelatedBreakpointKey() {
                    if (window.matchMedia("(min-width: 1300px)").matches) {
                        return "pc";
                    }

                    if (window.matchMedia("(min-width: 768px)").matches) {
                        return "tablet";
                    }

                    return "mobile";
                }

                /**
                 * 현재 구간에서 필요한 최소 슬라이드 개수
                 */
                function getRelatedVisibleCount() {
                    const breakpointKey = getRelatedBreakpointKey();

                    if (breakpointKey === "pc") {
                        return 3;
                    }

                    if (breakpointKey === "tablet") {
                        // slidesPerView가 2.3이므로 3개까지 화면에 걸쳐 보임
                        return 3;
                    }

                    return 1;
                }

                function getRelatedCanLoop() {
                    return relatedSlideCount > getRelatedVisibleCount();
                }

                /**
                 * 현재 active 슬라이드 내부 요소만 Tab 이동 허용
                 * active 슬라이드 다음에는 Swiper 컨트롤로 이동
                 */
                function bindActiveSlideFocus(swiper, $swiperArea, namespace) {
                    if (!swiper || !$swiperArea.length) return;

                    const managedAttribute = `data-${namespace}-focus-managed`;
                    const originalTabindexAttribute = `data-${namespace}-original-tabindex`;
                    const noTabindexValue = "__none__";

                    function saveOriginalTabindex($focusable) {
                        if ($focusable.attr(managedAttribute) === "true") return;

                        const originalTabindex = $focusable.attr("tabindex");

                        $focusable.attr({
                            [managedAttribute]: "true",
                            [originalTabindexAttribute]: originalTabindex == null ? noTabindexValue : originalTabindex,
                        });
                    }

                    function restoreOriginalTabindex($focusable) {
                        if ($focusable.attr(managedAttribute) !== "true") return;

                        const originalTabindex = $focusable.attr(originalTabindexAttribute);

                        if (originalTabindex === noTabindexValue) {
                            $focusable.removeAttr("tabindex");
                        } else {
                            $focusable.attr("tabindex", originalTabindex);
                        }
                    }

                    function updateActiveSlideFocus() {
                        if (!swiper || swiper.destroyed) return;

                        const $slides = $swiperArea.find(".swiper-slide");

                        $slides.each(function () {
                            const $slide = $(this);
                            const isActive = $slide.hasClass("swiper-slide-active");
                            const isDuplicate = $slide.hasClass("swiper-slide-duplicate");
                            const $focusable = $slide.find(SWIPER_FOCUSABLE_SELECTOR);

                            $focusable.each(function () {
                                const $item = $(this);

                                saveOriginalTabindex($item);

                                if (isActive && !isDuplicate) {
                                    restoreOriginalTabindex($item);
                                } else {
                                    $item.attr("tabindex", "-1");
                                }
                            });
                        });
                    }

                    updateActiveSlideFocus();

                    swiper.on("init slideChange transitionEnd loopFix update resize breakpoint observerUpdate", function () {
                        requestAnimationFrame(updateActiveSlideFocus);
                    });
                }

                /**
                 * Swiper 잠금 상태에 따라
                 * 섹션 클래스와 컨트롤 접근성 처리
                 */
                function bindSwiperLockState(swiper, $section, namespace) {
                    if (!swiper || !$section.length) return;

                    const $control = $section.find(".swiper-control");
                    const $controlButtons = $control.find("button");
                    const $navigationButtons = $control.find(".swiper-button-prev, .swiper-button-next, .swiper-control__button--prev, .swiper-control__button--next");
                    const $pagination = $section.find(".swiper-pagination");

                    let updateFrame = null;

                    function updateLockState() {
                        if (!swiper || swiper.destroyed) return;

                        const isLocked = Boolean(swiper.isLocked);

                        $section.toggleClass("is-swiper-lock", isLocked);

                        $control.attr("aria-hidden", String(isLocked));
                        $pagination.attr("aria-hidden", String(isLocked));

                        if (isLocked) {
                            $controlButtons.attr("tabindex", "-1");
                            swiper.autoplay?.stop();
                            return;
                        }

                        $controlButtons.removeAttr("tabindex");

                        /*
                         * resize 중 잘못 남은 잠금 클래스만 제거.
                         * 처음/마지막 슬라이드의 disabled 상태는 Swiper가 다시 계산함.
                         */
                        $navigationButtons.removeClass("swiper-button-lock");

                        swiper.navigation?.update();
                        swiper.pagination?.update();
                    }

                    /**
                     * Swiper의 resize 계산이 끝난 다음 잠금 상태 확인
                     */
                    function scheduleLockUpdate() {
                        if (updateFrame) {
                            cancelAnimationFrame(updateFrame);
                        }

                        updateFrame = requestAnimationFrame(function () {
                            updateFrame = requestAnimationFrame(function () {
                                if (!swiper || swiper.destroyed) return;

                                swiper.update();
                                swiper.navigation?.update();
                                swiper.pagination?.update();

                                updateLockState();
                                updateFrame = null;
                            });
                        });
                    }

                    updateLockState();
                    scheduleLockUpdate();

                    swiper.on(`lock.${namespace} unlock.${namespace} update.${namespace} observerUpdate.${namespace}`, updateLockState);

                    swiper.on(`resize.${namespace} breakpoint.${namespace} slidesLengthChange.${namespace}`, scheduleLockUpdate);
                }

                function moveSwiperToFirstSlide(swiper) {
                    if (!swiper || swiper.destroyed) return;

                    requestAnimationFrame(function () {
                        if (!swiper || swiper.destroyed) return;

                        if (swiper.params.loop && typeof swiper.slideToLoop === "function") {
                            swiper.slideToLoop(0, 0, false);
                        } else {
                            swiper.slideTo(0, 0, false);
                        }

                        swiper.update();
                        swiper.navigation?.update();
                        swiper.pagination?.update();
                    });
                }

                // 관련콘텐츠

                let relatedSwiper = null;
                let currentRelatedBreakpointKey = getRelatedBreakpointKey();

                /**
                 * 관련 콘텐츠 Swiper 생성
                 */
                function initRelatedSwiper() {
                    if (!relatedSwiperEl) return;

                    const relatedCanLoop = getRelatedCanLoop();
                    const $related = $(".insight-report-detail__related");

                    relatedSwiper = new Swiper(relatedSwiperSelector, {
                        slidesPerView: 1,
                        slidesPerGroup: 1,
                        spaceBetween: 15,
                        longSwipes: false,

                        loop: relatedCanLoop,

                        loopedSlides: relatedCanLoop ? relatedSlideCount : undefined,

                        loopAdditionalSlides: relatedCanLoop ? relatedSlideCount : 0,

                        watchSlidesProgress: true,
                        watchOverflow: true,

                        autoplay: relatedCanLoop
                            ? {
                                  delay: 4000,
                                  disableOnInteraction: false,
                              }
                            : false,

                        pagination: {
                            el: ".insight-report-detail__related .swiper-pagination",
                            clickable: true,

                            renderBullet(index, className) {
                                return `
                        <button
                            type="button"
                            class="${className}"
                            aria-label="${index + 1}번째 슬라이드로 이동"
                        >
                            <span class="swiper-pagination-bullet__number">
                                ${String(index + 1).padStart(2, "0")}
                            </span>

                            <span class="swiper-pagination-bullet__bar"></span>
                        </button>
                    `;
                            },
                        },

                        navigation: {
                            prevEl: ".insight-report-detail__related .swiper-control__button--prev",
                            nextEl: ".insight-report-detail__related .swiper-control__button--next",
                        },

                        breakpoints: {
                            768: {
                                slidesPerView: 2.3,
                                spaceBetween: 15,
                            },

                            1300: {
                                slidesPerView: 3,
                                slidesPerGroup: 1,
                                spaceBetween: 24,
                            },
                        },

                        on: {
                            init(swiper) {
                                bindSwiperLockState(swiper, $related, "related");

                                bindActiveSlideFocus(swiper, $(swiper.el), "related");

                                moveSwiperToFirstSlide(swiper);

                                // related 자동재생은 초기 정지
                                if (swiper.autoplay) {
                                    swiper.autoplay.stop();

                                    $related.find(".swiper-control__button--play").addClass("is-paused").attr("aria-label", "슬라이드 재생");
                                }
                            },
                        },
                    });
                }

                /**
                 * 관련 콘텐츠 Swiper 제거
                 */
                function destroyRelatedSwiper() {
                    if (!relatedSwiper) return;

                    const $related = $(".insight-report-detail__related");

                    $related.find(".swiper-slide-duplicate").remove();

                    $related.find('[data-related-focus-managed="true"]').each(function () {
                        const $focusable = $(this);
                        const originalTabindex = $focusable.attr("data-related-original-tabindex");

                        if (originalTabindex === "__none__") {
                            $focusable.removeAttr("tabindex");
                        } else {
                            $focusable.attr("tabindex", originalTabindex);
                        }

                        $focusable.removeAttr("data-related-focus-managed data-related-original-tabindex");
                    });

                    relatedSwiper.destroy(true, true);
                    relatedSwiper = null;
                }

                const relatedResizeEvent = Device.isMobile() ? "orientationchange.insightRelatedSwiper" : "resize.insightRelatedSwiper";

                $(window)
                    .off(".insightRelatedSwiper")
                    .on(relatedResizeEvent, function () {
                        const nextBreakpointKey = getRelatedBreakpointKey();

                        if (currentRelatedBreakpointKey === nextBreakpointKey) {
                            return;
                        }

                        currentRelatedBreakpointKey = nextBreakpointKey;

                        destroyRelatedSwiper();
                        initRelatedSwiper();
                    });

                initRelatedSwiper();

                // 관련 이벤트
                const $event = $(".insight-report-detail__event-swiper");

                const insightEventSwiperManager = createResponsiveSwiper(
                    [
                        {
                            key: "event",
                            selector: eventSwiperSelector,
                            breakpoint: 768,

                            options: {
                                slidesPerView: 1,
                                slidesPerGroup: 1,
                                initialSlide: 0,

                                loop: eventCanLoop,

                                loopedSlides: eventCanLoop ? 1 : undefined,

                                watchSlidesProgress: true,
                                watchOverflow: true,

                                autoplay: eventCanLoop
                                    ? {
                                          delay: 4000,
                                          disableOnInteraction: false,
                                      }
                                    : false,

                                pagination: {
                                    el: ".insight-report-detail__event-swiper .swiper-pagination",
                                    clickable: true,

                                    renderBullet(index, className) {
                                        return `
                                    <button
                                        type="button"
                                        class="${className}"
                                        aria-label="${index + 1}번째 슬라이드로 이동"
                                    >
                                        <span class="swiper-pagination-bullet__number">
                                            ${String(index + 1).padStart(2, "0")}
                                        </span>

                                        <span class="swiper-pagination-bullet__bar"></span>
                                    </button>
                                `;
                                    },
                                },

                                navigation: {
                                    prevEl: ".insight-report-detail__event-swiper .swiper-control__button--prev",
                                    nextEl: ".insight-report-detail__event-swiper .swiper-control__button--next",
                                },

                                /*
                                 * createResponsiveSwiper가 resize 때
                                 * 인스턴스를 새로 만들어도 매번 실행됨
                                 */
                                on: {
                                    init(swiper) {
                                        bindSwiperLockState(swiper, $event, "event");

                                        bindActiveSlideFocus(swiper, $(swiper.el), "event");

                                        /*
                                         * 모바일 진입 시 마지막 복제본부터
                                         * 시작하는 현상 방지
                                         */
                                        moveSwiperToFirstSlide(swiper);
                                    },
                                },
                            },
                        },
                    ],
                    {
                        breakpoint: null,
                        namespace: ".insightEventSwiper",
                    },
                );

                insightEventSwiperManager.init();

                /*
                 * init callback 실행 후 한 번 더 첫 위치 및
                 * navigation 잠금 상태를 보정
                 */
                requestAnimationFrame(function () {
                    const eventSwiper = insightEventSwiperManager.swipers.event;

                    if (!eventSwiper) return;

                    moveSwiperToFirstSlide(eventSwiper);

                    requestAnimationFrame(function () {
                        if (!eventSwiper || eventSwiper.destroyed) {
                            return;
                        }

                        eventSwiper.update();
                        eventSwiper.navigation?.update();
                        eventSwiper.pagination?.update();
                    });
                });
                // e:260728
            });
        </script>
